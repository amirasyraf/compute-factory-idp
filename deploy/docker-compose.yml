# Rotate container logs so the access log cannot fill the host disk.
x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: '5' }
services:
  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      IDP_DOMAIN: ${IDP_DOMAIN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backstage]
  backstage:
    logging: *logging
    image: compute-factory-idp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --no-node-snapshot --max-old-space-size=1536
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_DB: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backstage -d backstage']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
