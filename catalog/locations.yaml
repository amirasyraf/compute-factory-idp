apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: cf-vms
spec:
  type: url
  # No VMs left is a valid state: an empty glob must succeed so the last
  # destroyed VM is orphaned and deleted, not kept by a processing error.
  presence: optional
  targets:
    - https://github.com/amirasyraf/compute-factory-platform/blob/main/vms/*/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: cf-platform-templates
spec:
  type: url
  targets:
    - https://github.com/amirasyraf/compute-factory-platform/blob/main/catalog/templates/*/template.yaml
